# Project-owned ruff settings (design decision R18): created once, template-update never overwrites it.
# The rules come from the template-managed base below; keep the `extend` line.
# Add project paths with `extend-exclude`, project rules with `extend-select` and project-only
# exceptions with `[lint.per-file-ignores]`. Patterns that switch base rules off for template-managed
# files (automation/context/template-managed-paths.txt) make `make verify-python-lint` fail.
extend = "scripts/qa/ruff-base.toml"
