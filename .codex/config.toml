# Project-scoped Codex configuration.
# Codex loads this file only when the repository is trusted.
# Start with:
#   - root AGENTS.md
#   - docs/agent/index.md in the template source repo
#   - docs/agent/generated-project-index.md in generated repositories
#   - make agent-verify
# Shared repo-local skills live in .agents/skills/.
# Claude Context comes from the shared user-level daemon configured in ~/.codex/config.toml.
# Do not add a repo-local `mcp_servers.claude-context` command here.
# Repo-owned Claude Context hints for generated repos:
#   customExtensions = [".bsl"]
# Ignore patterns belong in committed .contextignore.

